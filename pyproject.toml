[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keel-web"
version = "0.7.0"
description = "Keel Web — reusable auth foundation, staff-panel shell, and client-panel shell (custom User, single-session, allauth adapters, TailAdmin chrome, persona avatars, image-gen core)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Milad Safaei" }]
license = { text = "UNLICENSED" }
dependencies = [
    "Django>=4.2",
    "django-allauth>=0.60",
    "whitenoise>=6.0",
    "Pillow>=10.0",
    "requests>=2.28",
    "phonenumbers>=8.13",
    "pycountry>=22.0",
]

# Optional: in-place CSS/JS minification in the manifest static storage. The
# storage backend degrades gracefully (no minify) when these are absent.
[project.optional-dependencies]
# Optional: the Font Awesome subset in keel_web.frontend (build_frontend_assets).
frontend = ["fonttools[woff]>=4.47", "brotli>=1.1"]
minify = ["rcssmin>=1.1", "rjsmin>=1.2"]

[project.urls]
Homepage = "https://github.com/miladsafaei-me/keel-web"

[tool.hatch.build.targets.wheel]
packages = ["src/keel_web"]
# hatchling includes every file under the package (templates/, static/, migrations/,
# non-.py assets) automatically — no force-include (which would double-add them and
# fail the build with "a second file is being added at the same path").
