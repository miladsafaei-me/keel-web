{% extends "keel_web_admin/base_admin.html" %}
{% load keel_icons %}

{% block content %}
<form id="password-form" method="post" class="panel-card max-w-xl space-y-5 rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03] lg:p-6">
  {% csrf_token %}
  {% include "keel_web_admin/panel/_form_errors.html" %}
  {% for field in form %}{% include "keel_web_admin/panel/_field.html" %}{% endfor %}
  <button type="submit" class="inline-flex items-center gap-2 rounded-full bg-brand-500 px-5 py-2.5 text-sm font-medium text-white hover:bg-brand-600">{% icon "check" class="h-4 w-4" %} Change the password</button>
</form>
{% endblock %}
