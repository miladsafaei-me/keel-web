{% comment %}A short status label. Input: text, tone (success, warning, error, brand or gray).{% endcomment %}
<span class="panel-badge inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium {% if tone == 'success' %}bg-success-50 text-success-700 dark:bg-success-500/15 dark:text-success-500{% elif tone == 'warning' %}bg-warning-50 text-warning-700 dark:bg-warning-500/15 dark:text-orange-400{% elif tone == 'error' %}bg-error-50 text-error-700 dark:bg-error-500/15 dark:text-error-500{% elif tone == 'brand' %}bg-brand-50 text-brand-700 dark:bg-brand-500/15 dark:text-brand-400{% else %}bg-gray-100 text-gray-700 dark:bg-white/5 dark:text-white/80{% endif %}">{{ text }}</span>
