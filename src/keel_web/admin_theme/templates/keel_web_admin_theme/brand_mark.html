{% load static %}{% if theme.logo %}<img class="kat-brand-mark kat-brand-mark--{{ size|default:'sidebar' }}{% if theme.logo_round %} kat-brand-mark--round{% endif %}" src="{% static theme.logo %}" alt="" width="80" height="80">{% else %}<span class="kat-brand-mark kat-brand-mark--{{ size|default:'sidebar' }} kat-brand-mark--initials" aria-hidden="true">{{ theme.initials }}</span>{% endif %}
