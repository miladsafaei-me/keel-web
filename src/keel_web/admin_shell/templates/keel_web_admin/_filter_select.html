{% comment %}
Minimal custom <select> for the lead filters. Renders a styled trigger + a
styled option panel (native <option> lists can't be themed), and submits the
parent GET form on pick. Params: name, placeholder, options ({value,label}), current.
{% endcomment %}
<div class="relative w-full md:w-52"
     x-data="{
       open: false,
       value: '{{ current|escapejs }}',
       label: '{% for o in options %}{% if o.value == current %}{{ o.label|escapejs }}{% endif %}{% endfor %}',
       pick(v, l) { this.value = v; this.label = l; this.open = false; this.$nextTick(() => this.$root.closest('form').requestSubmit()); }
     }"
     @click.outside="open = false" @keydown.escape="open = false">
  <input type="hidden" name="{{ name }}" :value="value">
  <button type="button" @click="open = !open"
          class="flex h-11 w-full items-center justify-between gap-2 rounded-xl border border-gray-200 bg-white px-4 text-sm shadow-theme-xs transition hover:border-gray-300 focus:outline-none focus:ring-2 focus:ring-brand-500/20 dark:border-gray-700 dark:bg-white/[0.03] dark:hover:border-gray-600"
          :class="value ? 'text-gray-700 dark:text-gray-200' : 'text-gray-400 dark:text-gray-500'">
    <span class="truncate" x-text="value ? label : '{{ placeholder|escapejs }}'"></span>
    <svg class="h-4 w-4 shrink-0 text-gray-400 transition-transform" :class="open && 'rotate-180'" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.06l3.71-3.83a.75.75 0 011.08 1.04l-4.25 4.39a.75.75 0 01-1.08 0L5.21 8.27a.75.75 0 01.02-1.06z" clip-rule="evenodd"/>
    </svg>
  </button>
  <ul x-show="open" x-cloak x-transition.origin.top.duration.150ms
      class="absolute z-30 mt-1.5 max-h-72 w-full min-w-max overflow-auto rounded-xl border border-gray-100 bg-white p-1.5 shadow-theme-lg ring-1 ring-black/5 dark:border-gray-800 dark:bg-gray-900 dark:ring-white/10">
    <li @click="pick('', '{{ placeholder|escapejs }}')"
        class="cursor-pointer whitespace-nowrap rounded-lg px-3.5 py-2.5 text-sm text-gray-500 transition hover:bg-brand-50 hover:text-brand-600 dark:text-gray-400 dark:hover:bg-brand-500/10"
        :class="!value && 'bg-brand-50 font-medium text-brand-600 dark:bg-brand-500/10'">{{ placeholder }}</li>
    {% for o in options %}
      <li @click="pick('{{ o.value|escapejs }}', '{{ o.label|escapejs }}')"
          class="cursor-pointer whitespace-nowrap rounded-lg px-3.5 py-2.5 text-sm text-gray-600 transition hover:bg-brand-50 hover:text-brand-600 dark:text-gray-300 dark:hover:bg-brand-500/10"
          :class="value === '{{ o.value|escapejs }}' && 'bg-brand-50 font-medium text-brand-600 dark:bg-brand-500/10'">{{ o.label }}</li>
    {% endfor %}
  </ul>
</div>
